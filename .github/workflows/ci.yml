name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install build tools and frontend dependencies
        run: |
          npm install --global pnpm@12.4.1
          pnpm --dir frontend install --frozen-lockfile
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
      - name: Formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Bindings are up to date
        run: |
          wails3 task bindings
          git diff --exit-code -- frontend/bindings
      # The test task builds the frontend, which the gui package embeds.
      - name: Test
        run: wails3 task test
      - name: Vet
        run: go vet -tags with_gvisor ./...
