name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Frontend
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global pnpm@12.4.1
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build
          pnpm --dir frontend test
      - name: Backend
        env:
          CGO_ENABLED: '0'
        run: go test -timeout 8m ./internal/...
      - name: Build amd64 and arm64
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/build-windows.ps1 -Arch amd64 -SkipFrontend -Version $env:BUILD_VERSION
          ./scripts/build-windows.ps1 -Arch arm64 -SkipFrontend -Version $env:BUILD_VERSION
          $version = if ($env:BUILD_VERSION) { $env:BUILD_VERSION.TrimStart('v') } else { 'dev' }
          foreach ($arch in @('amd64', 'arm64')) {
            Compress-Archive -LiteralPath "bin/clashcube-windows-$arch.exe" -DestinationPath "bin/ClashCube-$version-windows-$arch.zip"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows
          path: bin/ClashCube-*-windows-*.zip
          if-no-files-found: error
