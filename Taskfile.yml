version: '3'

vars:
  APP_NAME: ClashCube
  BIN: clashcube
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  STAMP:
    sh: date +%s
  TAGS: with_gvisor
  MIHOMO_VERSION:
    sh: cd third_party/mihomo && echo "alpha-$(git rev-parse --short HEAD)"
  LDFLAGS: -X main.version={{.VERSION}} -X github.com/localhost-copilot/clashcube/internal/updatesig.Stamp={{.STAMP}} -X github.com/metacubex/mihomo/constant.Version={{.MIHOMO_VERSION}}

env:
  CGO_ENABLED: 1
  CGO_CFLAGS: -mmacosx-version-min=12.0
  CGO_LDFLAGS: -mmacosx-version-min=12.0
  MACOSX_DEPLOYMENT_TARGET: "12.0"

tasks:
  deps:
    summary: Fetch the mihomo submodule and frontend packages
    cmds:
      - git submodule update --init --recursive
      - cd frontend && pnpm install

  bindings:
    summary: Generate the TypeScript bindings for the Go services
    sources: ["internal/gui/*.go", "internal/backend/*.go", "internal/mihomoapi/*.go", "internal/modules/*.go", "internal/profiles/*.go", "internal/settings/*.go"]
    cmds:
      - wails3 generate bindings -f '-tags {{.TAGS}}' -clean=true -ts -i -d frontend/bindings

  frontend:
    summary: Build the frontend into internal/gui/dist
    deps: [bindings]
    dir: frontend
    cmds:
      - pnpm run build

  build:
    summary: Build bin/clashcube
    deps: [frontend]
    cmds:
      - go build -tags {{.TAGS}},production -trimpath -buildvcs=false -ldflags="-w -s {{.LDFLAGS}}" -o bin/{{.BIN}} .

  build:dev:
    summary: Build bin/clashcube with devtools and no frontend minify
    cmds:
      - task: bindings
      - cd frontend && pnpm run build:dev
      - go build -tags {{.TAGS}} -buildvcs=false -gcflags=all=-l -ldflags="{{.LDFLAGS}}" -o bin/{{.BIN}} .

  run:
    summary: Build (dev) and run, opening the main window
    deps: [build:dev]
    cmds:
      - CLASHCUBE_SHOW=main ./bin/{{.BIN}}

  dev:
    summary: Vite with hot reload against a Go build
    cmds:
      - wails3 dev -config ./build/config.yml -port 9245

  app:
    summary: Bundle bin/ClashCube.app (ad-hoc signed)
    deps: [build]
    cmds:
      - scripts/bundle.sh "{{.VERSION}}" "{{.STAMP}}"

  install:
    summary: Bundle the app, then quit, replace and reopen ~/Applications/ClashCube.app
    deps: [app]
    cmds:
      - scripts/install.sh

  dmg:
    summary: Package bin/ClashCube.dmg
    deps: [app]
    cmds:
      - rm -f bin/{{.APP_NAME}}.dmg
      - hdiutil create -volname {{.APP_NAME}} -srcfolder bin/{{.APP_NAME}}.app -ov -format UDZO bin/{{.APP_NAME}}.dmg

  release:
    summary: Build and verify a versioned DMG (requires the helper signing key)
    deps: [dmg]
    cmds:
      - sh scripts/release.sh "{{.VERSION}}"

  test:
    cmds:
      - go test ./internal/...
      - cd frontend && pnpm run typecheck
      - cd frontend && pnpm test

  sync-replaces:
    summary: Copy mihomo's go.mod replace directives into ours
    cmds:
      - scripts/sync-replaces.sh
