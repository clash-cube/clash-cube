<%+header%>
<iframe id="clashcube-app" title="ClashCube" src="<%=pcdata(app_url)%>"
    style="display:block;width:100%;border:0;min-height:560px" allow="clipboard-write"></iframe>
<script>
(function () {
    var frame = document.getElementById('clashcube-app');
    function fit() {
        frame.style.height = Math.max(560, window.innerHeight - frame.getBoundingClientRect().top - 24) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
<%+footer%>
